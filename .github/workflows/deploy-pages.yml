name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub Pages 會放在 /<repo>/ 底下，build 時要帶上對應的 base path
      - name: Build
        run: |
          export BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          echo "base path: $BASE_PATH"
          npm run build

      # 前置作業（只需做一次）：Settings → Pages → Source 選「GitHub Actions」。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
