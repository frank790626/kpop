name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true 會在 repo 尚未開啟 Pages 時自動開啟（來源設為 GitHub Actions）。
      # 注意：private repo 且非付費方案時無法建立 Pages site，需改為 public 或手動在
      # Settings → Pages 把 Source 設成「GitHub Actions」。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # 純靜態站，整個 repo 直接當網站根目錄上傳
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
