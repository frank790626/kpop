name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 需要先在 repo Settings → Pages 把 Source 設成「GitHub Actions」（一次即可）。
      # Actions 的 GITHUB_TOKEN 沒有開啟 Pages 的權限，所以這裡不做 enablement。
      - uses: actions/configure-pages@v5

      # 純靜態站，整個 repo 直接當網站根目錄上傳
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
