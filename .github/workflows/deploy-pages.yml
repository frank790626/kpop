name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 前置作業（只需做一次）：Settings → Pages → Source 選「GitHub Actions」。
      # Actions 的 GITHUB_TOKEN 無法用 enablement 自動開啟 Pages
      # （會回 Resource not accessible by integration），所以這步只能手動。
      - uses: actions/configure-pages@v5

      # 純靜態站，整個 repo 直接當網站根目錄上傳
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
