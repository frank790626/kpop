name: Fetch member photos

# 一次性工具：新增團體後到 Actions 頁面手動執行，不排程
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: '全部重新抓（預設只補沒有照片的成員）'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 從 Wikipedia／Commons 下載成員照片
        run: node scripts/fetch-wiki-photos.mjs ${{ inputs.refresh && '--refresh' || '' }}

      - name: 有新照片才 commit
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "沒有新照片"
          else
            git commit -m "chore: 下載成員照片 [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 觸發部署
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
