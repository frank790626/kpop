name: Update videos

on:
  schedule:
    # 每天台北時間早上 6 點（UTC 22:00）
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 有設 YOUTUBE_API_KEY 就抓觀看數並依人氣排序，沒有就用公開 RSS 補新片
      - name: 抓取影片清單
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/update-videos.mjs

      # 成員照片：從 Wikipedia／Commons 抓自由授權的人像，已抓過的不會重抓
      - name: 抓取維基照片
        if: ${{ !cancelled() }}
        run: node scripts/fetch-wiki-photos.mjs

      # 前面任一步驟出錯，已經成功產生的部分仍然要 commit
      - name: 有變更才 commit
        if: ${{ !cancelled() }}
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated assets/img/wiki
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "影片清單沒有變化，不需要部署"
          else
            git commit -m "chore: 每日更新影片清單與成員照片 [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 用 GITHUB_TOKEN 推的 commit 不會觸發其他 workflow，所以這裡手動叫部署
      - name: 觸發部署
        if: ${{ !cancelled() && steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
