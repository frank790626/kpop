name: Update Threads

on:
  schedule:
    # 每 6 小時一次（台北時間 02、08、14、20 點）
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# 和其他更新流程錯開，避免同時 push 撞在一起
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 需要 Secret：THREADS_ACCESS_TOKEN；沒設就什麼都不做
      - name: 抓取 Threads 熱門貼文
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: node scripts/update-threads.mjs

      - name: 有變更才 commit
        if: ${{ !cancelled() }}
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Threads 沒有變化，不需要部署"
          else
            git commit -m "chore: 更新 Threads 熱門貼文 [skip ci]"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 用 GITHUB_TOKEN 推的 commit 不會觸發其他 workflow，所以這裡手動叫部署
      - name: 觸發部署
        if: ${{ !cancelled() && steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
